<!doctype html>
<html lang="en">
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tektur:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #030b07;
  --bg-2: #06150e;
  --panel: #081c13;
  --line: #123a2b;
  --text: #d6f5e4;
  --muted: #7fa592;
  --neon: #39ff8f;
  --neon-2: #12d6a0;
  --deep: #0f6b45;
  --warn: #c9ff5a;
  --font-display: 'Tektur', 'Segoe UI', sans-serif;
  --font-body: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Code', Consolas, monospace;
  --glow: 0 0 6px rgba(57,255,143,.7), 0 0 22px rgba(57,255,143,.35);
  --mx: 50%; --my: 30%;
  padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.65;
  padding-inline: 16px;
  overflow-x: hidden;
}
#rain { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: .5; pointer-events: none; }
.vignette {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(600px circle at var(--mx) var(--my), rgba(57,255,143,.10), transparent 60%),
    radial-gradient(ellipse at 50% 0%, rgba(15,107,69,.35), transparent 60%),
    radial-gradient(ellipse at 50% 100%, rgba(3,11,7,.95), transparent 70%);
}
.scan { position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: .07; background: repeating-linear-gradient(0deg, #000 0 1px, transparent 1px 3px); }
.wrap { position: relative; z-index: 1; max-width: 1120px; margin-inline: auto; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--neon); outline-offset: 3px; border-radius: 6px; }

nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding-block: 16px; margin-inline: -16px; padding-inline: 16px;
  background: linear-gradient(var(--bg) 40%, transparent);
  backdrop-filter: blur(6px);
}
.logo { font-family: var(--font-mono); font-weight: 700; color: var(--neon); text-shadow: var(--glow); letter-spacing: .02em; }
.logo i { color: var(--muted); font-style: normal; font-weight: 400; }
.links { display: flex; gap: 22px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.links a { position: relative; padding-block: 4px; transition: color .25s; }
.links a::after { content: ''; position: absolute; left: 0; bottom: 0; height: 1px; width: 0; background: var(--neon); box-shadow: var(--glow); transition: width .3s; }
.links a:hover, .links a.cur { color: var(--neon); }
.links a:hover::after, .links a.cur::after { width: 100%; }

.head { padding-block: 48px 28px; max-width: 780px; margin-inline: auto; }
.eyebrow { font-family: var(--font-mono); font-size: 13px; color: var(--neon-2); letter-spacing: .14em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--neon); box-shadow: var(--glow); animation: pulse 1.8s infinite; }
@keyframes pulse { 50% { opacity: .35; transform: scale(.7); } }
h1 {
  font-family: var(--font-display); font-weight: 900;
  font-size: clamp(44px, 9vw, 84px); line-height: 1; letter-spacing: -.02em;
  margin: 16px 0 12px;
  background: linear-gradient(100deg, #eafff3 0%, var(--neon) 40%, var(--neon-2) 70%, var(--deep) 100%);
  background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: sheen 6s ease-in-out infinite alternate;
  filter: drop-shadow(0 0 18px rgba(57,255,143,.35));
}
@keyframes sheen { to { background-position: 100% 0; } }
.lead { color: var(--muted); max-width: 54ch; margin: 0; }
.lead .p { font-family: var(--font-mono); color: var(--neon); }
.caret { display: inline-block; width: .6ch; height: 1.05em; background: var(--neon); vertical-align: -.2em; margin-left: 3px; animation: blink 1s steps(1) infinite; box-shadow: var(--glow); }
@keyframes blink { 50% { opacity: 0; } }

.bar { max-width: 780px; margin: 8px auto 26px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.tags { display: flex; gap: 10px; flex-wrap: wrap; }
.tag {
  font-family: var(--font-mono); font-size: 13px; padding: 7px 15px; border-radius: 999px;
  border: 1px solid var(--line); background: rgba(8,28,19,.8); color: var(--muted); cursor: pointer;
  transition: border-color .2s, color .2s, box-shadow .2s, background .2s;
}
.tag:hover { border-color: var(--neon-2); color: var(--text); }
.tag[aria-pressed="true"] { border-color: var(--neon); color: var(--neon); background: rgba(57,255,143,.08); box-shadow: var(--glow); }
.count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

.feed { max-width: 780px; margin-inline: auto; display: flex; flex-direction: column; gap: 22px; padding-bottom: 56px; }
.post {
  position: relative; border: 1px solid var(--line); border-radius: 26px;
  background: linear-gradient(160deg, rgba(10,36,25,.92), rgba(5,17,11,.92));
  padding: 24px 26px 22px; overflow: hidden;
  box-shadow: 0 18px 50px rgba(0,0,0,.45);
  transition: transform .3s, border-color .3s, box-shadow .3s;
  animation: rise .8s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, 0s);
}
.post::before { content: ''; position: absolute; inset: -1px; border-radius: inherit; background: radial-gradient(320px circle at var(--cx, 50%) var(--cy, 0%), rgba(57,255,143,.2), transparent 60%); opacity: 0; transition: opacity .3s; pointer-events: none; }
.post:hover { transform: translateY(-3px); border-color: var(--neon-2); box-shadow: 0 0 34px rgba(18,214,160,.2), 0 18px 50px rgba(0,0,0,.5); }
.post:hover::before { opacity: 1; }
@keyframes rise { from { opacity: 0; transform: translateY(22px); } }

.author { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.ring { flex: none; width: 54px; height: 54px; padding: 2px; border-radius: 50%; background: conic-gradient(from 160deg, var(--neon), var(--neon-2), var(--deep), var(--neon)); box-shadow: var(--glow); }
.ava { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; background: var(--bg); }
.ava.mono { display: grid; place-items: center; font-family: var(--font-display); font-weight: 900; font-size: 24px; color: var(--neon); text-shadow: var(--glow); }
.who { min-width: 0; line-height: 1.3; }
.who b { display: block; font-family: var(--font-mono); font-size: 15px; font-weight: 700; color: var(--neon); letter-spacing: .02em; }
.who span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.meta { margin-left: auto; text-align: right; font-family: var(--font-mono); font-size: 12px; color: var(--muted); line-height: 1.5; }

.post h2 { font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 4vw, 29px); line-height: 1.2; margin: 0 0 10px; text-wrap: balance; }
.post .ex { margin: 0; color: #b8d8c7; max-width: 62ch; }
.pt { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.pt span { font-family: var(--font-mono); font-size: 12px; color: var(--neon-2); border: 1px solid var(--deep); border-radius: 999px; padding: 3px 11px; background: rgba(57,255,143,.05); }
.more { margin-top: 18px; display: flex; align-items: center; gap: 12px; }
.rd {
  font-family: var(--font-mono); font-size: 13px; color: var(--neon); background: none; cursor: pointer;
  border: 1px solid var(--neon); border-radius: 999px; padding: 8px 18px;
  transition: box-shadow .25s, background .25s;
}
.rd:hover { box-shadow: var(--glow); background: rgba(57,255,143,.08); }
.body { margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--line); }
.body p { margin: 0 0 14px; color: #b8d8c7; max-width: 62ch; }
.body pre { margin: 0 0 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: rgba(3,11,7,.8); font-family: var(--font-mono); font-size: 12.5px; line-height: 1.7; color: var(--neon-2); overflow-x: auto; white-space: pre; }

footer { position: relative; z-index: 1; border-top: 1px solid var(--line); margin-top: 20px; padding-block: 28px 40px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; max-width: 1120px; margin-inline: auto; }
footer span:first-child { color: var(--neon-2); }

@media (max-width: 520px) {
  .post { padding: 20px 18px 18px; border-radius: 22px; }
  .author { flex-wrap: wrap; }
  .meta { margin-left: 0; text-align: left; width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  html { scroll-behavior: auto; }
  #rain { display: none; }
}
</style>

<script>
var AVATAR = 'avatar.jpg';
var NICK = 'xivi.pw';
var ROLE = 'reverse engineer';
var POSTS = [
  {
    date: '2026-10-12', read: '10 min', tags: ['reverse'],
    title: 'Where to start in reverse engineering?',
    excerpt: 'How do you start your journey in reverse engineering? What tools should you use and what knowledge do you need?',
    body: [
      'Let\'s start with the very basics — what is reverse engineering? It\'s reverse design, or taking a program apart. The simplest example: a programmer writes a program, say in C++, then sends it all to the compiler.',
      'The compiler, in turn, turns all that code into instructions the processor understands — assembly — and the result of its work is a binary, which is the finished program the user will run.',
      'So the task of reverse engineering is to crack that binary open and, if possible, recover the code of the program itself. This is called disassembly — the process where a binary is opened up and turned into assembly code. Then decompilation is performed, or converting it into pseudocode — a more readable and understandable form of the program\'s code.',
      'But to disassemble and decompile something, you need the right equipment, and that\'s exactly what we\'re going to talk about now.',
      'So, there are 3 of the most popular and most widely used disassemblers — IDA Pro, Ghidra, Binary Ninja. Which one you use is up to you. Personally, I prefer Ghidra, even though it falls short of IDA in some ways — but again, the software is completely free, unlike IDA.',
      'Besides disassemblers, there are also debuggers — programs that let you read a program while it\'s running. So essentially, analysis is divided into 2 types: static analysis and dynamic analysis. The difference is that with static analysis you look at the binary\'s code as it is, while with dynamic analysis you look at the binary\'s code while it executes, and you can also track its actions and interact with it and the code. As for debuggers, I\'d probably recommend x64dbg, since I use it myself, and overall it\'s very useful, pleasant, and free.',
      'We\'ve covered what disassemblers and debuggers are, now let\'s move to the final stage — what do you need to know and be able to do?',
      'Let me start with the basics, of course — Windows and Linux. You need to know how these operating systems work, because without that there\'s no reverse engineering, especially in malware analysis, where almost everything revolves around working with the system. Second point: knowledge of assembly. Yes, it sounds wild and sad, because no one really wants to dig through all that horror, and I understand that perfectly, BUT — it\'s mega useful knowledge, without which things will be very tough. That said, you don\'t have to be an expert-level asm user — it\'s enough to just understand how instructions work, their patterns, and commonly used constructs. Third point — Python. In modern reality, Python has become a very important little piece in almost every programming department. In reverse engineering, Python is used for writing keygens, automating checks, and much more, so it\'s worth learning. And the fourth point is, of course, understanding how to work with the software you use — whether it\'s Ghidra or IDA, doesn\'t matter — you need to learn to navigate the program easily and spend as little time as possible orienting yourself in space :)',
      'Finally, I\'ll say that reverse engineering is mostly practice rather than theory — 90% practice, 10% theory. Practice, solve challenges on specialized sites, and take part in CTFs. All the best!'
    ]
  },
  {
    date: '2026-10-12', read: '6 min', tags: ['reverse', 'tools'],
    title: 'Ghidra and x64dbg: breaking down your first binary in an evening',
    excerpt: 'Static analysis shows what a program can do, dynamic analysis shows what it\'s doing right now. Together they quickly lead from an opaque exe to clear logic.',
    body: [
      'I always start with reconnaissance without running anything: file type, architecture, strings, and the import table. Often that\'s enough to understand where to look next.',
      { code: 'file sample.exe\nstrings -n 8 sample.exe | less' },
      'Then I open the file in Ghidra and go from interesting strings and imports to the functions that use them. I rename variables and functions right away, otherwise an hour later I won\'t understand myself.',
      'Next I run the sample in x64dbg inside an isolated VM, set breakpoints on the calls I found, and verify my guesses against live data. Every confirmed hypothesis goes back into Ghidra as a comment.'
    ]
  },
  {
    date: '2026-10-12', read: '7 min', tags: ['malware', 'reverse'],
    title: 'Packers: how to spot them by entropy and imports',
    excerpt: 'A packed file barely looks like a normal program. A few simple signs help you figure this out even before running a disassembler.',
    body: [
      'Compressed and encrypted sections have high entropy: values closer to 8 bits per byte than to 4–5, like normal code and data.',
      'The second sign is a tiny import table. If the only things visible from the whole library are LoadLibrary and GetProcAddress, the program loads the rest at runtime.',
      'The third is unusual section names and sections that are simultaneously writable and executable. One sign alone isn\'t much, but together they almost always point to a packer.'
    ]
  }
];

(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var cv = document.getElementById('rain'), cx = cv.getContext('2d');
  var chars = '0123456789ABCDEF', fs = 16, cols, drops, W, H;
  function size() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(W / fs); drops = [];
    for (var i = 0; i < cols; i++) drops.push(Math.random() * H / fs);
    cx.fillStyle = '#030b07'; cx.fillRect(0, 0, W, H);
  }
  size(); window.addEventListener('resize', size);
  var last = 0;
  function rain(t) {
    if (t - last > 55) {
      last = t;
      cx.fillStyle = 'rgba(3,11,7,.14)'; cx.fillRect(0, 0, W, H);
      cx.font = fs + 'px "JetBrains Mono", monospace';
      for (var i = 0; i < cols; i++) {
        var y = drops[i] * fs;
        cx.fillStyle = Math.random() > .975 ? '#c9ffe0' : '#14a864';
        cx.fillText(chars[(Math.random() * 16) | 0], i * fs, y);
        if (y > H && Math.random() > .975) drops[i] = 0;
        drops[i] += 1;
      }
    }
    requestAnimationFrame(rain);
  }
  if (!reduce) requestAnimationFrame(rain);

  var root = document.documentElement;
  window.addEventListener('pointermove', function (e) {
    root.style.setProperty('--mx', e.clientX + 'px');
    root.style.setProperty('--my', e.clientY + 'px');
  });

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function fmt(d) { var p = d.split('-'); return MONTHS[parseInt(p[1], 10) - 1] + ' ' + parseInt(p[2], 10) + ', ' + p[0]; }
  function avatarHTML() {
    var inner = AVATAR
      ? '<img class="ava" src="' + esc(AVATAR) + '" alt="' + esc(NICK) + ' avatar">'
      : '<span class="ava mono" aria-hidden="true">' + esc(NICK.charAt(0)) + '</span>';
    return '<div class="ring">' + inner + '</div>';
  }

  var feed = document.getElementById('feed');
  function render(list) {
    feed.innerHTML = '';
    list.forEach(function (p, i) {
      var art = document.createElement('article');
      art.className = 'post';
      art.style.setProperty('--d', (i * 0.08) + 's');
      var body = p.body.map(function (b) {
        return typeof b === 'string' ? '<p>' + esc(b) + '</p>' : '<pre>' + esc(b.code) + '</pre>';
      }).join('');
      art.innerHTML =
        '<div class="author">' + avatarHTML() +
          '<div class="who"><b>' + esc(NICK) + '</b><span>' + esc(ROLE) + '</span></div>' +
          '<div class="meta">' + fmt(p.date) + '<br>' + esc(p.read) + ' read</div>' +
        '</div>' +
        '<h2>' + esc(p.title) + '</h2>' +
        '<p class="ex">' + esc(p.excerpt) + '</p>' +
        '<div class="pt">' + p.tags.map(function (t) { return '<span>#' + esc(t) + '</span>'; }).join('') + '</div>' +
        '<div class="more"><button class="rd" type="button" aria-expanded="false">read full post ↓</button></div>' +
        '<div class="body" hidden>' + body + '</div>';
      var btn = art.querySelector('.rd'), bd = art.querySelector('.body');
      btn.addEventListener('click', function () {
        var open = bd.hidden;
        bd.hidden = !open;
        btn.setAttribute('aria-expanded', String(open));
        btn.textContent = open ? 'collapse ↑' : 'read full post ↓';
      });
      art.addEventListener('pointermove', function (e) {
        var r = art.getBoundingClientRect();
        art.style.setProperty('--cx', (e.clientX - r.left) + 'px');
        art.style.setProperty('--cy', (e.clientY - r.top) + 'px');
      });
      feed.appendChild(art);
    });
  }

  var tagBox = document.getElementById('tags'), countEl = document.getElementById('count'), current = 'all';
  var all = ['all'];
  POSTS.forEach(function (p) { p.tags.forEach(function (t) { if (all.indexOf(t) < 0) all.push(t); }); });
  function noun(n) { return n === 1 ? 'post' : 'posts'; }
  function apply() {
    var list = current === 'all' ? POSTS : POSTS.filter(function (p) { return p.tags.indexOf(current) >= 0; });
    render(list);
    countEl.textContent = list.length + ' ' + noun(list.length);
    tagBox.querySelectorAll('.tag').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.t === current)); });
  }
  all.forEach(function (t) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'tag'; b.dataset.t = t;
    b.textContent = t === 'all' ? 'all' : '#' + t;
    b.addEventListener('click', function () { current = t; apply(); });
    tagBox.appendChild(b);
  });
  apply();

  document.getElementById('yr').textContent = new Date().getFullYear();
})();
</script>
